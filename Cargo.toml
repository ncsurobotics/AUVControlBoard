[package]
authors = ["AquaPack Robotics <aquapack@aquapackrobotics.org>"]
edition = "2021"
# If you change the name here, you must also do it in flake.nix (and run `cargo generate-lockfile` afterwards)
name = "auv_control_board"
description = "Communication library for AUVControlBoard"
version = "1.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1.12.1"
derive-getters = "0.5.0"
futures = { version = "0.3.33", default-features = false, features = ["std"] }
rerun = "0.35.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.22.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tokio-serial = "5.5.0"
tokio-util = "0.7.19"
tracing = "0.1.44"
